<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THSC Summary Dashboard</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ffffff; color: #1b1915; font-family: "Segoe UI", Arial, sans-serif; }
  .card { max-width: 420px; padding: 28px; border: 1px solid #e6ded0; text-align: center; }
  img { width: 54px; height: 72px; object-fit: contain; }
  h1 { font-family: Georgia, serif; font-weight: 600; font-size: 1.4rem; margin: 12px 0 6px; }
  p { color: #6b6252; line-height: 1.5; margin: 0 0 18px; }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border: 0; background: #1b1915; color: #f0c864; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="build/icon.png" alt="">
    <h1>No internet connection</h1>
    <p>The dashboard needs the internet to sign in and to show the shared data. It will open by itself when the connection is back.</p>
    <button type="button" id="retry">Try again</button>
  </div>
  <script>
    const target = new URLSearchParams(location.search).get("url") || "https://thscdashboards.vercel.app";
    const go = () => { location.href = target; };
    document.getElementById("retry").addEventListener("click", go);
    window.addEventListener("online", go);
    setInterval(() => { if (navigator.onLine) go(); }, 15000);
  </script>
</body>
</html>
